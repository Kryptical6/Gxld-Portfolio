name: Keep Supabase warm

# Supabase free projects pause after ~7 days of no activity, which causes a slow
# "cold start" on the next request. This pings a lightweight RPC on a schedule so
# the project stays active.
#
# Setup: add two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       = https://<your-ref>.supabase.co
#   SUPABASE_ANON_KEY  = your publishable / anon key

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase RPC
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" \
            -X POST "${SUPABASE_URL}/rest/v1/rpc/get_ticket" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"keepalive-noop"}' || true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
